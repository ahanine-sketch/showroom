<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Mono:wght@400;500&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#736331",
                        "on-tertiary-fixed-variant": "#283f95",
                        "background": "#fbf9f4",
                        "on-surface-variant": "#4d4635",
                        "on-primary-fixed-variant": "#564500",
                        "on-tertiary-fixed": "#001454",
                        "secondary-fixed-dim": "#dac589",
                        "surface-tint": "#725c00",
                        "surface-bright": "#fbf9f4",
                        "inverse-surface": "#30312e",
                        "on-tertiary-container": "#0b287f",
                        "inverse-on-surface": "#f2f1ec",
                        "on-primary": "#ffffff",
                        "secondary": "#6d5d2c",
                        "primary": "#725c00",
                        "surface-container": "#f0eee9",
                        "error": "#ba1a1a",
                        "tertiary": "#4258af",
                        "on-surface": "#1b1c19",
                        "primary-container": "#b8960c",
                        "surface-variant": "#e4e2dd",
                        "surface": "#fbf9f4",
                        "primary-fixed": "#ffe082",
                        "secondary-fixed": "#f7e1a3",
                        "tertiary-fixed-dim": "#b8c4ff",
                        "outline-variant": "#d0c6af",
                        "on-secondary-fixed-variant": "#544516",
                        "secondary-container": "#f7e1a3",
                        "surface-container-low": "#f5f3ee",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#231b00",
                        "tertiary-fixed": "#dde1ff",
                        "primary-fixed-dim": "#e9c340",
                        "outline": "#7e7662",
                        "tertiary-container": "#7f94ef",
                        "on-error-container": "#93000a",
                        "on-background": "#1b1c19",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#e9c340",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#231b00",
                        "surface-container-highest": "#e4e2dd",
                        "surface-dim": "#dbdad5",
                        "on-primary-container": "#3d3000",
                        "surface-container-high": "#eae8e3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Newsreader"],
                        "body": ["Manrope"],
                        "label": ["Manrope"],
                        "serif": ["Cormorant Garamond"],
                        "sans": ["DM Sans"],
                        "mono": ["DM Mono"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .luxury-gradient {
            background: radial-gradient(circle at center, #b8960c, #725c00);
        }
        .ghost-border {
            border: 1px solid rgba(208, 198, 175, 0.2);
        }
        .inset-frame {
            border: 1px solid rgba(184, 150, 12, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container/30">
<main class="flex min-h-screen">
<!-- Left Section: Editorial Identity -->
<section class="hidden lg:flex w-1/2 bg-[#F7F3EC] items-center justify-center relative overflow-hidden">
<!-- Inset Gold Frame -->
<div class="absolute inset-6 inset-frame pointer-events-none"></div>
<!-- Abstract background texture/gradient for depth -->
<div class="absolute inset-0 opacity-20" data-alt="soft warm cream background with subtle golden light leak effect for luxury editorial feel" style="background-image: radial-gradient(circle at 20% 30%, rgba(184, 150, 12, 0.1) 0%, transparent 50%);">
</div>
<div class="relative z-10 flex flex-col items-center text-center px-12">
<h1 class="font-serif text-[120px] leading-none text-primary-container tracking-tighter">
                    SIQ
                </h1>
<p class="font-sans text-[14px] uppercase tracking-[0.3em] text-on-surface-variant mt-2 font-medium">
                    ShowroomIQ
                </p>
<div class="w-[60px] h-[1px] bg-primary-container/40 my-8"></div>
<blockquote class="font-serif italic text-[18px] text-on-surface-variant tracking-wide">
                    "Performance. Précision. Excellence."
                </blockquote>
</div>
<!-- Subtle brand decoration -->
<div class="absolute bottom-12 left-12">
<span class="font-mono text-[10px] uppercase tracking-widest text-outline">Established MMXXIV</span>
</div>
</section>
<!-- Right Section: Login Form -->
<section class="w-full lg:w-1/2 bg-surface-container-lowest flex items-center justify-center px-6 sm:px-12">
<div class="w-full max-w-[400px]">
<!-- Mobile Branding (Hidden on Desktop) -->
<div class="lg:hidden mb-12 text-center">
<h2 class="font-serif text-4xl text-primary-container italic">SIQ</h2>
<p class="font-sans text-[10px] uppercase tracking-[0.2em] text-outline mt-1">ShowroomIQ</p>
</div>
<div class="space-y-2 mb-10">
<h2 class="font-headline text-[36px] text-on-surface font-medium leading-tight">
                        Bienvenue
                    </h2>
<p class="font-sans text-[14px] text-on-surface-variant tracking-wide">
                        Connectez-vous pour accéder à votre showroom.
                    </p>
</div>
<!-- Tab Toggle -->
<div class="flex p-1 bg-surface-container-low rounded-full mb-8 max-w-fit">
<button class="px-6 py-1.5 text-[11px] font-mono uppercase tracking-wider bg-surface-container-lowest text-on-surface shadow-sm rounded-full transition-all">
                        Email
                    </button>
<button class="px-6 py-1.5 text-[11px] font-mono uppercase tracking-wider text-outline hover:text-on-surface transition-all">
                        Mobile
                    </button>
</div>
<form class="space-y-6">
<div class="space-y-1.5">
<label class="font-sans text-[11px] uppercase tracking-wider text-outline font-semibold ml-1" for="email">
                            Adresse e-mail
                        </label>
<input class="w-full h-12 px-4 bg-surface-container-low ghost-border rounded-lg focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all outline-none text-on-surface placeholder:text-outline-variant/60" id="email" placeholder="nom@showroom.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-end ml-1">
<label class="font-sans text-[11px] uppercase tracking-wider text-outline font-semibold" for="password">
                                Mot de passe
                            </label>
<a class="font-sans text-[11px] text-primary hover:text-primary-container transition-colors font-medium" href="#">
                                Oublié ?
                            </a>
</div>
<input class="w-full h-12 px-4 bg-surface-container-low ghost-border rounded-lg focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all outline-none text-on-surface" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center space-x-2 pt-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-sans text-[13px] text-on-surface-variant" for="remember">Restaurer la session sur cet appareil</label>
</div>
<button class="w-full h-14 luxury-gradient text-white font-sans font-bold text-[14px] uppercase tracking-[0.15em] rounded-lg shadow-lg shadow-primary/10 hover:shadow-primary/20 active:scale-[0.98] transition-all mt-4" type="submit">
                        Se connecter
                    </button>
</form>
<div class="mt-12 pt-8 border-t border-surface-container text-center">
<p class="font-sans text-[14px] text-on-surface-variant">
                        Accès restreint aux partenaires SIQ. 
                        <a class="text-primary font-semibold hover:underline decoration-primary-container underline-offset-4" href="#">
                            Demander l'accès
                        </a>
</p>
</div>
</div>
</section>
</main>
<!-- Global Layout Separation Logic: Suppressing Nav Shell as per Task Requirements -->
</body></html>
